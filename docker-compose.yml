services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      VIDEO_API_BASE_URL: ${VIDEO_API_BASE_URL:-https://api.replicate.com/v1}
      VIDEO_API_TOKEN: ${VIDEO_API_TOKEN:-}
      VIDEO_MODEL: ${VIDEO_MODEL:-}
      VIDEO_TIMEOUT_SECONDS: ${VIDEO_TIMEOUT_SECONDS:-60}
      VIDEO_PROMPT_FIELD: ${VIDEO_PROMPT_FIELD:-prompt}
      VIDEO_ASPECT_RATIO_FIELD: ${VIDEO_ASPECT_RATIO_FIELD:-aspect_ratio}
      VIDEO_DURATION_FIELD: ${VIDEO_DURATION_FIELD:-duration}
      EPISODE_EXPORT_DIR: /app/data/exports
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  episode_exports:
