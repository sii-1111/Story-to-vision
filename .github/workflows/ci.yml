name: Story-to-Vision CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check apps/api

      - name: Test
        run: pytest -q

      - name: Validate provider smoke-test CLI
        run: python -m py_compile scripts/provider_smoke_test.py && python scripts/provider_smoke_test.py --help
      - name: Validate local screenplay smoke-test CLI
        run: python -m py_compile scripts/local_screenplay_smoke_test.py && python scripts/local_screenplay_smoke_test.py --help

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Build web app
        run: npm run build
